name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # The build is a real check here, not a formality. The tests run under
      # vitest in a node environment and never render a component, so a broken
      # import inside a .jsx page — the most likely breakage from any refactor
      # that moves files — is invisible to them and shows up only here.
      - run: npm run build
