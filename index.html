<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>פלטפורמת הקהילה</title>

    <!-- An installable app (PRD MOB-1). The manifest names it and points at the
         icons in public/icons/, which scripts/generate-icons.mjs draws. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a4a66" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- iOS reads none of the manifest's icons, and needs these to put the app
         on the home screen under its own name and picture. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="הקהילה" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
